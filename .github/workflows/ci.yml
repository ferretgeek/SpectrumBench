name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Install exact dependencies
        run: python -m pip install --requirement requirements-dev.txt
      - name: Lint, compile, and test
        run: |
          ruff format --check .
          ruff check .
          python -m compileall -q stress_tool scripts tests benchmark_token_speed.py token_stress_test.py
          python -m pytest
          node --check demo/app.js
          python scripts/verify_publication.py
          python scripts/audit_public_tree.py
      - name: Audit dependencies and high-severity Python findings
        run: |
          python -m pip_audit -r requirements.txt --progress-spinner off
          bandit -q -lll -r stress_tool scripts benchmark_token_speed.py token_stress_test.py
      - name: Scan source for secrets
        run: |
          detect-secrets scan --all-files --exclude-files '(\.git|\.venv|\.pytest_cache|\.ruff_cache|__pycache__|docs[\\/]images|demo[\\/]assets)' . > /tmp/detect-secrets.json
          python - <<'PY'
          import json
          with open("/tmp/detect-secrets.json", encoding="utf-8") as handle:
              report = json.load(handle)
          findings = sum(len(items) for items in report.get("results", {}).values())
          if findings:
              for filename, items in sorted(report["results"].items()):
                  for item in items:
                      print(f"{filename}:{item['line_number']}: {item['type']}")
              raise SystemExit(f"detect-secrets found {findings} unresolved result(s)")
          PY

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate Compose model
        run: |
          cp .env.docker.example .env
          docker compose config --quiet
          rm .env
      - name: Build non-root image
        run: docker build --tag spectrumbench:test .
